<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><title>Mosaic Control</title>
<link rel="stylesheet" href="styles.css?v=0.9.0"></head>
<body><main>
<header><div><small>MAGICIAN CONTROL</small><strong id="query">等待搜尋</strong></div><span id="conn">連線中…</span></header>
<section id="waiting" class="waiting">等待觀眾輸入新的搜尋詞…</section>
<section id="panel" class="hidden">
  <div class="rowhead"><span>Brave 快速候選</span><span id="timing"></span></div>
  <div id="grid" class="grid"></div>
  <button id="googleBtn" class="google" type="button">Google 緊急救援</button>
  <div class="note">Brave 有可用圖：直接點圖。四張都不行：Google 救援會帶入同一搜尋詞。Google 選圖回傳機制下一階段接上；這版先完成 Control / Gallery 分離與目標同步。</div>
  <div id="selected" class="selected hidden"></div>
</section>
</main><script src="config.js?v=0.9.0"></script><script src="app.js?v=0.9.0"></script></body></html>
