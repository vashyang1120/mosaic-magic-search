<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Mosaic Gallery</title>
<link rel="stylesheet" href="styles.css?v=0.6.0">
</head>
<body>
<main class="app">
<header class="topbar"><strong>相簿</strong><span>•••</span></header>

<section id="waiting" class="waiting">
  <div class="spinner">◌</div>
  <h1>等待新的搜尋</h1>
  <p>保持這個頁面開啟即可。</p>
  <small id="conn">連線中…</small>
</section>

<section id="candidateView" class="candidate-view hidden">
  <div class="candidate-head">
    <div>
      <div class="kicker">收到搜尋</div>
      <div id="queryTitle" class="query-title"></div>
    </div>
    <div id="totalTime" class="total-time"></div>
  </div>
  <div class="hint">4 張 Brave 候選照同步預載。這版會在每張圖 Ready 後，立即於背景建立「高速 Mosaic 測試圖」。</div>
  <div id="candidateGrid" class="candidate-grid"></div>
</section>

<section id="selectedView" class="selected-view hidden">
  <div class="selected-top">
    <div>
      <div class="kicker">Mosaic Prototype</div>
      <div id="selectedQuery" class="selected-query"></div>
    </div>
    <button id="backBtn" class="small-btn" type="button">返回</button>
  </div>

  <div class="compare">
    <div class="panel">
      <div class="panel-label">原始候選</div>
      <img id="selectedImage" alt="">
    </div>
    <div class="panel">
      <div class="panel-label">高速 Mosaic</div>
      <canvas id="mosaicCanvas"></canvas>
    </div>
  </div>

  <div id="selectedTiming" class="selected-timing"></div>
  <div class="mosaic-controls">
    <label>格數
      <select id="tileSize">
        <option value="10">較粗</option>
        <option value="7" selected>標準</option>
        <option value="5">較細</option>
      </select>
    </label>
    <button id="regenBtn" type="button">重新生成</button>
  </div>
  <div class="prototype-note">這一版先測「人物辨識度 + 生成速度」。還不是正式偽相簿；下一階段才把結果接進可滑動、可縮放的相簿。</div>
</section>

<section id="debug" class="debug hidden"><pre id="debugText"></pre></section>
</main>
<script src="config.js?v=0.6.0"></script>
<script src="app.js?v=0.6.0"></script>
</body>
</html>
