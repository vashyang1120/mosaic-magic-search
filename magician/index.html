<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>Mosaic Control</title>
<link rel="stylesheet" href="styles.css?v=1.0.0"></head><body><main>
<header><div><small>MAGICIAN CONTROL</small><strong id="query">等待搜尋</strong></div><span id="conn">連線中…</span></header>
<section id="waiting" class="waiting">等待觀眾輸入新的搜尋詞…</section>
<section id="panel" class="hidden">
<div id="targetState" class="target-state idle">尚未選定目標</div>
<button id="googleBtn" class="google-primary" type="button"><span class="gmark">G</span><span><b>Google 圖片</b><small>正式主流程</small></span></button>
<div class="google-help">找到合適照片後：長按圖片 → 分享 → Mosaic Share。上傳成功後會回到手機桌面。</div>
<div class="divider"><span>快速捷徑</span></div>
<div class="rowhead"><span>Brave 4 張候選</span><span id="timing"></span></div>
<div id="grid" class="grid"></div>
<div class="note">如果 Brave 剛好有清楚的單人照，直接點即可；沒有就使用 Google。</div>
</section></main>
<script src="config.js?v=1.0.0"></script><script src="app.js?v=1.0.0"></script></body></html>
