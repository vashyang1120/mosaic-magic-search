<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>圖片搜尋</title>
  <link rel="stylesheet" href="styles.css?v=0.2.9" />
</head>
<body>
  <header class="top-shell">
    <div class="brand-row">
      <div class="brand-word" aria-label="Google">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </div>
      <div class="account-dot" aria-hidden="true"><span></span></div>
    </div>

    <form id="searchForm" class="search-row">
      <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M10.5 4a6.5 6.5 0 1 0 4.09 11.56L20 20.97 20.97 20l-5.41-5.41A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
    </span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜尋圖片" />
      <button id="clearBtn" class="clear-btn hidden" type="button" aria-label="清除">×</button>
      <button class="search-btn" type="submit">搜尋</button>
    </form>

    <nav class="tabs" aria-label="搜尋分類">
      <button type="button" data-tab="ai">AI 模式</button>
      <button type="button" data-tab="all">全部</button>
      <button type="button" data-tab="images" class="active">圖片</button>
      <button type="button" data-tab="videos">影片</button>
      <button type="button" data-tab="shorts">短片</button>
      <button type="button" data-tab="news">新聞</button>
      <button type="button" data-tab="shopping">購物</button>
      <button type="button" data-tab="web">網頁</button>
    </nav>
  </header>

  <main>
    <div id="status" class="status"></div>
    <section id="chips" class="chips hidden" aria-label="建議搜尋"></section>
    <section id="resultsFeed" class="results-feed" aria-label="圖片搜尋結果"></section>
    <section id="altResults" class="alt-results hidden" aria-live="polite"></section>
  </main>

  <dialog id="previewDialog" class="preview-dialog">
    <div class="preview-shell">
      <header class="preview-header">
        <div class="source-block">
          <div class="source-favicon" id="sourceFavicon">●</div>
          <div class="source-name" id="sourceName">來源網站</div>
        </div>
        <div class="preview-actions-top">
          <button type="button" aria-label="更多">⋮</button>
          <button id="closePreviewBtn" type="button" aria-label="關閉">×</button>
        </div>
      </header>

      <div class="preview-image-wrap">
        <img id="previewImage" alt="" />
      </div>

      <section class="preview-meta">
        <div class="preview-title-row">
          <div>
            <h2 id="previewTitle"></h2>
            <div id="previewSourceText" class="preview-source-text"></div>
          </div>
          <a id="visitBtn" class="visit-btn" target="_blank" rel="noopener">造訪 ›</a>
        </div>

        <div class="preview-bottom-actions">
          <button type="button"><span>↗</span>分享</button>
          <button type="button"><span>▱</span>儲存</button>
        </div>
      </section>

      <section class="related-preview">
        <div id="relatedPreviewGrid" class="related-preview-grid"></div>
      </section>
    </div>
  </dialog>

  <section id="debugPanel" class="debug-panel hidden">
    <strong>Current target</strong>
    <pre id="debugText"></pre>
  </section>

  <script src="config.js?v=0.2.9"></script>
  <script src="app.js?v=0.2.9"></script>
</body>
</html>
