<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Google</title>
  <link rel="stylesheet" href="styles.css?v=0.3.0" />
</head>
<body>
  <main class="page-shell">
    <header class="incognito-header">
      <button class="menu-btn" type="button" aria-label="選單">☰</button>
      <div class="google-logo" aria-label="Google">
        <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
      </div>
      <button class="signin-btn" type="button">登入</button>
    </header>

    <form id="handoffForm" class="search-box">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 4.09 11.56L20 20.97 20.97 20l-5.41-5.41A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
      </span>
      <input id="queryInput" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="搜尋圖片" />
      <button id="clearBtn" class="clear-btn hidden" type="button" aria-label="清除">×</button>
      <span class="mic-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.1A5 5 0 0 0 17 11Z"/>
        </svg>
      </span>
    </form>

    <nav class="tabs" aria-label="搜尋分類">
      <span>AI 模式</span>
      <span>全部</span>
      <span class="active">圖片</span>
      <span>影片</span>
      <span>短片</span>
      <span>新聞</span>
      <span>購物</span>
      <span>網頁</span>
    </nav>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script src="config.js?v=0.3.0"></script>
  <script src="app.js?v=0.3.0"></script>
</body>
</html>
