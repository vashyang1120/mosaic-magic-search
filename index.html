<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>圖片搜尋</title>
  <link rel="stylesheet" href="styles.css?v=0.2.3" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <form id="searchForm" class="search-wrap" role="search">
        <input id="searchInput" type="search" inputmode="search" autocomplete="off"
          enterkeyhint="search" placeholder="搜尋圖片" aria-label="搜尋圖片" />
        <button id="searchBtn" type="submit" aria-label="搜尋">搜尋</button>
      </form>
      <nav class="tabs" aria-label="搜尋類型">
        <span class="tab active">圖片</span>
        <span class="tab muted">全部</span>
        <span class="tab muted">影片</span>
      </nav>
    </header>

    <section id="intro" class="intro">
      <div class="intro-icon" aria-hidden="true">⌕</div>
      <h1>圖片搜尋</h1>
      <p>輸入人物、角色或名人名稱。</p>
    </section>

    <section id="status" class="status hidden" aria-live="polite"></section>
    <section id="grid" class="image-grid" aria-label="圖片搜尋結果"></section>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>

  <dialog id="previewDialog" class="preview-dialog">
    <div class="preview-shell">
      <div class="preview-toolbar">
        <button id="closePreview" class="icon-btn" type="button" aria-label="返回">‹</button>
        <div class="preview-source" id="previewSource"></div>
        <button id="confirmBtn" class="choose-btn" type="button">選這張</button>
      </div>
      <div class="preview-stage">
        <img id="previewImage" alt="圖片預覽" />
      </div>
      <div class="preview-info">
        <div id="previewTitle" class="preview-title"></div>
        <div id="previewDimensions" class="preview-dimensions"></div>
      </div>
    </div>
  </dialog>

  <script src="config.js?v=0.2.3"></script>
  <script src="app.js?v=0.2.3"></script>
</body>
</html>
